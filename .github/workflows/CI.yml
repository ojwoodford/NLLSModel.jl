name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
permissions:
  actions: write
  contents: read
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.threads }} thread(s) - ${{ matrix.test_args || 'all groups' }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    # Nightly is informational: its failures (often in dependencies, on an unreleased Julia) do not fail the run
    continue-on-error: ${{ matrix.version == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1'
          - 'nightly'
        os:
          - ubuntu-latest
        arch:
          - x64
        threads:
          - '1'
        test_args:
          - ''          # every test group (test/runtests.jl)
        include:
          # The threaded paths are only taken with more than one thread: on 4 threads, only the thread-dependent test
          # group runs (rules.md 30)
          - version: '1.10'
            os: ubuntu-latest
            arch: x64
            threads: '4'
            test_args: 'threaded'
          - version: '1'
            os: ubuntu-latest
            arch: x64
            threads: '4'
            test_args: 'threaded'
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
        continue-on-error: ${{ matrix.version == 'nightly' }}
      - uses: julia-actions/julia-runtest@v1
        continue-on-error: ${{ matrix.version == 'nightly' }}
        with:
          test_args: ${{ matrix.test_args }}
      # Nightly's coverage is not uploaded: a partial or differently counted run would change the merged figure
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version != 'nightly'
      - uses: codecov/codecov-action@v7
        if: matrix.version != 'nightly'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
